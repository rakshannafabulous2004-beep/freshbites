spring.application.name=FreshBite

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/freshbite_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Admin credentials (for admin panel access)
freshbite.admin.email=admin@freshbite.com
freshbite.admin.password=admin123

# Frontend static files path
freshbite.frontend.path=frontend
